<svg xmlns="http://www.w3.org/2000/svg" width="560" height="500" viewBox="0 0 560 500" role="img"><title>A workflow for one research step</title><rect width="560" height="500" fill="white"/><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="14" y="12" width="532" height="48" rx="9" fill="#eef5f5" stroke="#14736b"/><text x="280" y="42" text-anchor="middle" font-size="19" fill="#123b38">Understand the question and inputs</text><path d="M280 61v13m-5-5 5 5 5-5" fill="none" stroke="#14736b" stroke-width="2"/><rect x="14" y="77" width="532" height="48" rx="9" fill="#eef5f5" stroke="#14736b"/><text x="280" y="107" text-anchor="middle" font-size="19" fill="#123b38">Compare suitable methods</text><path d="M280 126v13m-5-5 5 5 5-5" fill="none" stroke="#14736b" stroke-width="2"/><rect x="14" y="142" width="532" height="48" rx="9" fill="#eef5f5" stroke="#14736b"/><text x="280" y="172" text-anchor="middle" font-size="19" fill="#123b38">Discuss and confirm the current step</text><path d="M280 191v13m-5-5 5 5 5-5" fill="none" stroke="#14736b" stroke-width="2"/><rect x="14" y="207" width="532" height="48" rx="9" fill="#eef5f5" stroke="#14736b"/><text x="280" y="237" text-anchor="middle" font-size="19" fill="#123b38">Save code and complete inputs</text><path d="M280 256v13m-5-5 5 5 5-5" fill="none" stroke="#14736b" stroke-width="2"/><rect x="14" y="272" width="532" height="48" rx="9" fill="#eef5f5" stroke="#14736b"/><text x="280" y="302" text-anchor="middle" font-size="19" fill="#123b38">Run in a fresh R session</text><path d="M280 321v13m-5-5 5 5 5-5" fill="none" stroke="#14736b" stroke-width="2"/><rect x="14" y="337" width="532" height="48" rx="9" fill="#eef5f5" stroke="#14736b"/><text x="280" y="367" text-anchor="middle" font-size="19" fill="#123b38">Inspect the actual results</text><path d="M280 386v13m-5-5 5 5 5-5" fill="none" stroke="#14736b" stroke-width="2"/><rect x="14" y="402" width="532" height="48" rx="9" fill="#eef5f5" stroke="#14736b"/><text x="280" y="432" text-anchor="middle" font-size="19" fill="#123b38">Report, then discuss the next step</text><text x="280" y="487" text-anchor="middle" font-size="12" fill="#4b5563">Heavy computation: prepare code and resource notes; await a run decision.</text></g></svg>
